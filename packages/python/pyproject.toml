[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-ledger-os"
version = "0.1.0"
description = "Python package surface for Trust Ledger OS manifest and phase catalog."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
trust-ledger-os = "trust_ledger_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "trust_ledger_os.vercel_app:app"
